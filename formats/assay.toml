# The assay format: plans generated by planbuild.py (docs/plan-grammar.md §2).
# Phase 1 implements this spec end to end. It is the worked example of docs/extending.md §2:
# every regex here is matched against raw block text (inline markup kept), anchored per block.

id = "assay"
name = "Assay plan (planbuild.py)"

[detect]
# Each pattern that matches a line outside fenced blocks adds its weight once.
patterns = [
  { regex = '^### P\d+[a-z]?(?:-\d+)?-T\d+: ', weight = 60 },
  { regex = '^\*\*Step \d+ — ', weight = 25 },
  { regex = '^File `[^`]+` \((?:full contents|exact diff)', weight = 15 },
]

[outline]
tasks_after = { level = 2, regex = '^Tasks$' }
# The phase includes the P: `P1`, `P3c-1`.
task = { level = 3, regex = '^(?P<id>(?P<phase>P\d+[a-z]?(?:-\d+)?)-T(?P<ord>\d+)): (?P<title>.+)$' }
tasks_end_level = 2

[outline.manifest]
# The marker and its items are consumed by the outline; they fall in no step.
marker = '^\*\*Files\*\*$'
# An item may end in a parenthesised note: Modify `p` (restored from … in step 1).
item = '^(?P<change>Create|Modify|Delete) `(?P<paths>[^`]+)`(?: \(.+\))?$'
changes = { Create = "create", Modify = "modify", Delete = "delete" }

[[outline.steps]]
block = "paragraph"
regex = '^\*\*Step (?P<n>\d+) — (?P<title>.+)\*\*$'

[settings]
# Paragraphs that are instructions to the human, not prose (become Manual(Marked)).
manual_markers = ['(?i)\bby hand\b', '(?i)\bRens runs\b', '(?i)\bmanual step\b']

# --- Recognizers, tried in this order at each position of a step -------------------------------

[[recognizer]]
kind = "file-block"
id = "file-block#assay"
# The op runs to the final "):" of the line, so parentheses inside it are fine. Once this lead
# matched, an op no prefix below covers is an error (unknown-file-op), never a Note.
lead = '^File `(?P<path>[^`]+)` \((?P<op>.+)\):$'
# Longest prefix of the captured `op` wins. `write` takes create vs overwrite from the manifest.
ops = { "full contents" = "write", "exact diff" = "patch" }

[[recognizer]]
kind = "ceremony"
id = "ceremony#git-apply-temp"
# Only directly after an ApplyPatch: the save-to-TEMP + git apply + Remove-Item block (decision D17).
after = "patch"
body = '^git apply --whitespace=nowarn "\$env:TEMP\\[^"]+\.patch"\nRemove-Item "\$env:TEMP\\[^"]+\.patch"\n$'

[[recognizer]]
kind = "delete"
id = "delete#sentence"
lead = '^Delete `(?P<path>[^`]+)`\.$'

[[recognizer]]
kind = "generated"
id = "generated#notice"
lead = '^`(?P<path>[^`]+)` is generated by .*(?:not|never) written by hand'

[[recognizer]]
kind = "generated"
id = "generated#regenerated"
# `Cargo.lock` changes: it is regenerated by cargo in the next step. …
lead = '^`(?P<path>[^`]+)` changes: it is regenerated by '

[[recognizer]]
kind = "generated"
id = "generated#restored"
# Restore `p` from the verified scratch commit `…` (never written by hand; …): + the script.
lead = '^Restore `(?P<path>[^`]+)` from .*never written by hand'

[[recognizer]]
kind = "script"
id = "script#assay"
# Body patterns that set the script's intent; first match wins, default "verify". "commit"
# selects the Commit action (its script carries ScriptIntent::Other). The commit line is often
# inside an `if`, so it is matched anywhere in a line.
intents = [
  { intent = "commit", body = '(?m)\bgit commit\b' },
  { intent = "gate", body = '\$gate\s*=\s*\$LASTEXITCODE' },
]

[[recognizer]]
kind = "expected-block"
id = "expected-block#assay"
# The paragraph before a `text` fence; amends the script before it.
lead = '^Expected \((?P<spec>[^)]*)\):$'
# How the parenthesis maps to an exit expectation; first match wins. `code` takes the captured
# number: 0 is success, anything else that exact code.
exit = [
  { spec = '\bexit code (?P<code>\d+)\b', exit = "code" },
]
# The fence holds summary lines: an ordered subsequence of the output, `…` = any run.
lines = "summary"

[[recognizer]]
kind = "expected-prose"
id = "expected-prose#assay"
lead = '^Expected: (?P<text>.+)$'
# Prose never passes a script alone; this only picks the exit code to check before asking.
# First match wins, so order matters: "the commit, then no output from …" is `any`, because the
# `no output` row comes before the `the commit` row. No match is `any` too.
exit = [
  { text = '(?i)\b(fail|build error|does not exist|error)\b', exit = "failure" },
  { text = '(?i)\bno (output|matches?)\b', exit = "any" },
  { text = '(?i)\b(pass(es)?|succeeds?|the commit)\b', exit = "success" },
]
